c:
  name: C
  icon: devicon-c-plain
  title: C
  summary: "Learning C by writing small programs, making mistakes, and figuring out why they happen."
  links:
    - label: "github"
      url: "https://github.com/dream-wa1ker/init87"
  body: |
    <p>I got into C after spending some time jumping between programming languages. I started with Python, looked into Go, and then Rust. Eventually, I wanted to get closer to how programs actually work, rather than relying on a language or runtime to handle everything for me. C seemed like a good place to start.</p>
    <p><a href="https://github.com/dream-wa1ker/init87">init87</a> is my first C project. It's mostly small programs, experiments, and things I write to make sense of the language. I'm still learning, so a lot of it comes down to trying something, getting it wrong, and understanding what went wrong.</p>
    <p>I'm particularly interested in the relationship between C, memory, and the operating system. That interest is also why I'm learning x86-64 assembly and Linux syscalls alongside C. I want to understand what's happening beneath the code, one layer at a time. Hoping that one day, I will contribute to the Linux Kernel...</p>
  hero:
    src: /assets/img/init87.png
    alt: "C source code from the init87 programming experiments"
    caption: "Learning C"


asm:
  name: x86-64 Assembly
  icon: fa-solid fa-microchip
  title: x86-64 Assembly
  summary: "Learning assembly through pwn.college, from registers to reading compiler output."
  links:
    - label: "pwn.college"
      url: "https://pwn.college/computing-101/"
    - label: "github"
      url: "https://github.com/dream-wa1ker/init88"
  body: |
    <p>I got into x86-64 assembly through <a href="https://pwn.college/computing-101/">pwn.college's Computing 101</a> course. I wanted to understand what actually happens beneath C: how instructions manipulate registers, how memory is accessed, and how programs interact with the machine.</p>
    <p>I'm not an assembly expert yet, but I can read <code>objdump</code> output to a reasonable extent and follow what a compiled program is doing. I'm still learning the details, particularly the relationship between instructions, calling conventions, and the underlying machine code.</p>
    <p>My project <a href="https://github.com/dream-wa1ker/init88">init88</a> is where I document and practise that learning. The goal is to get comfortable moving between C code, assembly instructions, and raw machine bytes, building a foundation for debugging and reverse engineering. All thanks to random redditor for suggesting me to learn x86-64.</p>
  hero:
    src: /assets/img/init88.png
    alt: "x86-64 assembly instructions and register operations viewed in a disassembler"
    caption: "Under the Hood"

arch:
  name: Arch Linux
  icon: devicon-archlinux-plain
  title: Arch Linux & Hyprland
  summary: "Two years on Arch, building my own Wayland desktop with Hyprland."
  links:
    - label: "github"
      url: "https://github.com/dream-wa1ker/hyprdots-0"
  body: |
    <p>I've been daily driving Arch Linux with Hyprland for almost two years. I like knowing what's installed on my system, why it's there, and how the pieces fit together. I'd rather build my own desktop than have a desktop environment make those decisions for me.</p>
    <p>My dotfiles project, <a href="https://github.com/dream-wa1ker/hyprdots-0">hyprdots-0</a>, is where I put that philosophy into practice. It brings together Hyprland, Noctalia, and the rest of my desktop configuration, managed with chezmoi. The goal isn't just to make the desktop look good, but to understand and maintain the system behind it. Lua:)</p>
    <p>Two years of daily driving Arch has taught me to value control over convenience, minimalism over unnecessary services, and understanding over blindly copying configurations. And, as @david_bombal said, with great power comes great responsibility...</p>
  hero:
    src: /assets/img/hyprdots-0.png
    alt: "The hyprdots-0 Arch Linux desktop running Hyprland with a Nord-inspired theme"
    caption: "My Arch Linux Desktop"

git:
  name: Git & GitHub
  icon: devicon-git-plain
  title: Git & GitHub
  summary: "Almost four years, for code and the docs vault."
  body: |
    <p>Almost 4 years - it started when I started using linux. Version control for the code, and increasingly for the documentation vault too - it's grown past the point where I can keep it all in my head.</p>

posix:
  name: POSIX / Syscalls
  icon: fa-solid fa-terminal
  title: POSIX / Syscalls
  summary: "The layer between the C call and what the kernel did."
  body: |
    <p>This is the layer between "the C function you called" and "what the kernel actually did." And from a securit point of view - understanding the kernel does a lot good than instead of just guessing the C optimisations. This is usually where the interesting footguns live - open(), read(), fopen() all have a story once you go past the signature and; honestly I do not know all of them - just learning.</p>

docs:
  name: Technical Docs
  icon: fa-solid fa-book
  title: Technical Documentation
  summary: "The reference I wish existed when I was stuck."
  body: |
    <p>I write a lot. Previously in my school days I write in paper, hand printing whole books in my own words and working out 25 notebooks of math problems in calculus; I have not changed in a year - even now I write the kind of reference I wish existed when I was stuck - full signatures, edge cases, errno tables, worked examples, that cross-linked to related functions.</p>
    <p>I simply could not resist; I unusually document or write more that what actually is needed - like a writeup; that actually helps when I come back to read my custom C string library -(ah from my future me).</p>
