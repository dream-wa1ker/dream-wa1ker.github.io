sha256:
  name: sha256
  icon: fa-solid fa-shield-halved
  title: sha256(3)
  summary: "SHA-256 rebuilt from scratch, to understand it instead of just calling it."
  body: |
    <p>A from-scratch implementation of SHA-256 in C. I wanted to understand how the algorithm works instead of just calling a library function.</p>
    <p>It isn't on GitHub yet; I'm still writing the documentation.<br>GPG is next, but I need to read up on the protocol first.</p>

init88:
  name: init88
  icon: fa-solid fa-microchip
  title: init88(1)
  summary: "x86-64 assembly on Linux: registers, calling conventions, objdump."
  status: "learning"
  links:
    - label: "github"
      url: "https://github.com/dream-wa1ker/init88"
  body: |
    <p>I started this after <b>init87</b> to learn x86-64 assembly on Linux. It's early: so far I've only covered registers.</p>
    <p>The goal is to read what a compiler produces.<br>That means <code>objdump</code> output, and raw bytes through <code>xxd</code>, which I'll need for reverse engineering later.</p>

init87:
  name: init87
  icon: devicon-c-plain
  title: init87(1)
  summary: "C fundamentals, learned by writing experiments by hand."
  status: "learning"
  links:
    - label: "github"
      url: "https://github.com/dream-wa1ker/init87"
    - label: "site"
      url: "https://dream-wa1ker.github.io/init87"
  body: |
    <p>My first C project. The main branch is small programs and experiments, all written by hand.</p>
    <p>The web branch is different. Most of it was generated by an AI and I never rewrote it, so don't trust it.<br>Only the doubts and errors sections are mine.</p>

pomoc:
  name: pomoc
  icon: fa-solid fa-terminal
  title: pomoc(1)
  summary: "A pomodoro timer for polybar, my first project written without AI."
  links:
    - label: "github"
      url: "https://github.com/dream-wa1ker/pomoc"
  body: |
    <p>A pomodoro timer for the polybar on my Linux desktop.<br>It's the first project I wrote without AI help, and the first one other people have used.</p>
    <p>I posted an early version on r/suckless and got useful feedback. One person pointed out that my countdown was wrong: I decremented a counter every second, which drifts.<br>The fix was to save the start time and work out the elapsed time from the clock each time.</p>
    <p>After that it ran properly, and it has had contributions since.</p>
  hero:
    src: /assets/img/pomoc.jpeg
    alt: "The pomoc countdown running inside polybar"
    caption: "The Bar"

signatures:
  name: signatures
  icon: fa-solid fa-book-open
  title: signatures(7)
  summary: "A reference vault for the C standard library and POSIX."
  body: |
    <p>My notes on the C standard library and POSIX, kept in Obsidian.<br>Each entry has the full signature, how the function behaves in practice, the errno values it can set, and the mistakes that are easy to make with it.</p>
    <p>Sources are the <code>man 3</code> pages, the BSD and Linux man pages online, and the C standard.<br>It's still growing and lives only on my machine for now, not on GitHub.</p>
  hero:
    src: /assets/img/obsidian.png
    alt: "An Obsidian note for one function, showing its signature and errno table"
    caption: "The Vault"
